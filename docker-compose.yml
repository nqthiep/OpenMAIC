services:
  openmaic:
    build:
      context: .
      args:
        - ALPINE_MIRROR=${ALPINE_MIRROR:-}
        - NPM_REGISTRY=${NPM_REGISTRY:-}
        # NEXT_PUBLIC_* values are compiled into the browser bundle. Empty values
        # follow each feature's documented default; explicit build-time overrides
        # can be supplied on the command line.
        # env_file below does not feed build args. For a legacy-chat rollback:
        # NEXT_PUBLIC_PI_CHAT_ENABLED=false docker compose up -d --build openmaic
        - ALLOWED_FRAME_ANCESTORS=${ALLOWED_FRAME_ANCESTORS:-}
        - NEXT_PUBLIC_PERSISTENCE=${NEXT_PUBLIC_PERSISTENCE:-}
        - NEXT_PUBLIC_MAIC_EDITOR_ENABLED=${NEXT_PUBLIC_MAIC_EDITOR_ENABLED:-}
        - NEXT_PUBLIC_MAIC_EDITOR_RENDERER_ENABLED=${NEXT_PUBLIC_MAIC_EDITOR_RENDERER_ENABLED:-}
        - NEXT_PUBLIC_MAIC_PLAYBACK_RENDERER_ENABLED=${NEXT_PUBLIC_MAIC_PLAYBACK_RENDERER_ENABLED:-}
        - NEXT_PUBLIC_PI_CHAT_ENABLED=${NEXT_PUBLIC_PI_CHAT_ENABLED:-}
        - NEXT_PUBLIC_COURSEWARE_REFERENCE_ENABLED=${NEXT_PUBLIC_COURSEWARE_REFERENCE_ENABLED:-}
        - NEXT_PUBLIC_SHOW_VOCATIONAL_TEST_UI=${NEXT_PUBLIC_SHOW_VOCATIONAL_TEST_UI:-}
        - NEXT_PUBLIC_ENABLE_VIDEO_EXPORT=${NEXT_PUBLIC_ENABLE_VIDEO_EXPORT:-}
        - NEXT_PUBLIC_VIDEO_EXPORT_CTA_DESTINATION=${NEXT_PUBLIC_VIDEO_EXPORT_CTA_DESTINATION:-}
        - NEXT_PUBLIC_ENABLE_PPTX_IMPORT=${NEXT_PUBLIC_ENABLE_PPTX_IMPORT:-}
        - NEXT_PUBLIC_PRO_WORKBENCH_ENABLED=${NEXT_PUBLIC_PRO_WORKBENCH_ENABLED:-}
    ports:
      - '3000:3000'
    env_file:
      - .env.local
    environment:
      # Point the app at the render service when it's running. This wins over any
      # RENDER_SERVICE_URL in .env.local; the service only starts under the
      # "video-export" profile. The app's capability check probes the service's
      # /health, so if the profile is off (service absent) the app reports the
      # MP4 export disabled and degrades to the ZIP-download path — this URL
      # being set does not, by itself, advertise a working render.
      - RENDER_SERVICE_URL=http://render-service:9000
      # What a visitor made before signing in moves into the account on the first request after
      # sign-in (the owner identity seam's automatic claim). "explicit" leaves it to
      # POST /api/identity/claim, which KHAITAM's pages do not call.
      - OWNER_CLAIM_TRIGGER=${OWNER_CLAIM_TRIGGER:-auto}
      # OmniRoute runs beside the app and connects by itself: the dashboard password sits in the
      # `omniroute-secrets` volume mounted below, and the addresses default to the service names.
      # Every value here is optional and only overrides (ops/omniroute/README.md); an empty value
      # means "use the default".
      - OMNIROUTE_ADMIN_PASSWORD=${OMNIROUTE_ADMIN_PASSWORD:-}
      - OMNIROUTE_GATE_SECRET=${OMNIROUTE_GATE_SECRET:-}
      - OMNIROUTE_PUBLIC_URL=${OMNIROUTE_PUBLIC_URL:-}
      - OMNIROUTE_GATE_PORT=${OMNIROUTE_GATE_PORT:-8081}
      - OMNIROUTE_INTERNAL_URL=${OMNIROUTE_INTERNAL_URL:-http://omniroute:20128}
      - OMNIROUTE_API_URL=${OMNIROUTE_API_URL:-http://omniroute:20129}
    networks:
      - default # outbound internet (LLM/media provider APIs, etc.)
      - render # reach the render service over the isolated network
      - omniroute # reach OmniRoute and its gate on their own network
    volumes:
      # AI provider keys are set in the Settings popup (top bar) and stored in the database; put
      # PROVIDER_SECRET_KEY (encrypts them) in .env.local. server-providers.yml is not read.
      - openmaic-data:/app/data
      # The dashboard password that `omniroute-init` made, read-only.
      - omniroute-secrets:/run/omniroute:ro
    restart: unless-stopped

  # Optional PostgreSQL backing for the app-embedded persistence API.
  # The app reads DATABASE_URL from .env.local; keeping
  # that value there avoids changing the default browser-only deployment.
  postgres:
    image: postgres:16
    profiles:
      - server-persistence
    environment:
      - POSTGRES_DB=openmaic
      - POSTGRES_USER=openmaic
      # Development default only. Override this and the matching DATABASE_URL
      # before using the stack outside a local trusted environment.
      - POSTGRES_PASSWORD=${PERSISTENCE_POSTGRES_PASSWORD:-openmaic-dev}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openmaic -d openmaic']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - openmaic-postgres:/var/lib/postgresql/data
    restart: unless-stopped

  # Isolated MP4 render service (Node 22 + Chromium + FFmpeg) for classroom video
  # export (issue #866). Opt-in: only starts with `--profile video-export`, since
  # the image is heavy (bundles Chromium + FFmpeg) and the capability is optional.
  #
  #   docker compose --profile video-export up --build
  #
  # Sits on the `render` network (`internal: true`, no host/internet gateway).
  # It shares that network with `openmaic` only so the app can reach it; to stop
  # the untrusted Chromium from initiating connections *back* to the app over
  # that shared network, the container's entrypoint installs an iptables egress
  # lockdown (needs CAP_NET_ADMIN) that drops all outbound except loopback and
  # replies on app-initiated connections. The export ZIP is self-contained, so
  # the render needs no outbound at all.
  render-service:
    build: ./render-service
    profiles:
      - video-export
    expose:
      - '9000'
    # Required for the entrypoint's iptables egress lockdown. Without it the
    # service still boots, but logs a warning and does NOT block Chromium egress.
    cap_add:
      - NET_ADMIN
    environment:
      - PORT=9000
      # The standard CPU profile prefers BeginFrame but permits producer's
      # compatibility fallback (for example iframe GenUI). It still fixes one
      # producer worker, one render, and one extraction. Select low-memory to
      # force screenshot instead of relying on producer auto-selection.
      - RENDER_RESOURCE_PROFILE=${RENDER_RESOURCE_PROFILE:-standard}
      - RENDER_CHUNK_EXECUTION=${RENDER_CHUNK_EXECUTION:-false}
      - RENDER_CHUNK_COUNT=${RENDER_CHUNK_COUNT:-1}
      - RENDER_CHUNK_WORKERS=${RENDER_CHUNK_WORKERS:-1}
      - RENDER_MAX_PARALLEL_CHUNKS=${RENDER_MAX_PARALLEL_CHUNKS:-1}
      - RENDER_CHUNK_SIZE_FRAMES=${RENDER_CHUNK_SIZE_FRAMES:-0}
      - RENDER_TARGET_CHUNK_FRAMES=${RENDER_TARGET_CHUNK_FRAMES:-0}
      - PRODUCER_HEADLESS_SHELL_PATH=/usr/bin/chromium-headless-shell
      - RENDER_MAX_CONCURRENCY=1
      - RENDER_MAX_CONCURRENT_EXTRACTIONS=1
      # Long compositions still need CDP headroom even with one explicit worker.
      - PRODUCER_PUPPETEER_PROTOCOL_TIMEOUT_MS=900000
      # OpenMAIC's long slide exports currently exhaust producer's 15s static
      # verification budget and disable dedup anyway. Skip that guaranteed-lost
      # startup cost until the verifier can share/scale its plan across workers.
      - HF_STATIC_DEDUP=false
      # In this default topology the app is exposed directly and does NOT set
      # TRUST_PROXY_HEADERS, so every caller collapses to one identity. A
      # per-identity limit would then throttle the whole deployment to a single
      # render, so disable it here and rely on RENDER_MAX_CONCURRENCY + the global
      # RENDER_MAX_QUEUE cap. Set this >0 only with a trusted proxy supplying
      # per-user identity (see render-service/README.md).
      - RENDER_MAX_JOBS_PER_USER=0
      - RENDER_PREVIEW_TIMEOUT_MS=${RENDER_PREVIEW_TIMEOUT_MS:-20000}
      - RENDER_PREVIEW_MAX_IN_FLIGHT=${RENDER_PREVIEW_MAX_IN_FLIGHT:-8}
      # Preview callers send a durable owner identity in x-openmaic-client, so
      # keep this per-owner guard enabled. Set it to 0 only in deployments that
      # call /preview without an owner identity.
      - RENDER_PREVIEW_MAX_PER_USER=${RENDER_PREVIEW_MAX_PER_USER:-2}
    # Bound RAM: each render (Chromium + FFmpeg + archive expansion) is memory-heavy.
    # The standard profile requires 8 GiB. For the explicit low-memory profile,
    # set RENDER_RESOURCE_PROFILE=low-memory and RENDER_SERVICE_MEMORY_LIMIT=4g.
    mem_limit: ${RENDER_SERVICE_MEMORY_LIMIT:-8g}
    # Chromium media/frame work can exceed Docker's 64 MiB default shared-memory
    # mount. This is a ceiling inside the selected profile cgroup, not eager allocation.
    shm_size: 2gb
    networks:
      - render
    restart: unless-stopped

  # OmniRoute LLM gateway (third-party image: diegosouzapw/omniroute,
  # https://github.com/diegosouzapw/OmniRoute) — one OpenAI-compatible endpoint in front of many AI
  # providers. A service beside `openmaic`, on by default and connected to it without any value in
  # .env; ops/omniroute/README.md explains the wiring. To run the app alone: `docker compose up -d openmaic`.
  #
  # Trust boundary: OmniRoute is third-party code, so it gets its own `omniroute` network (shared
  # with `openmaic` and `omniroute-gate` only) and publishes no port of its own. Postgres stays on
  # `default`, so OmniRoute cannot reach the database. Its only ingress is the gate below, which
  # asks the app to confirm a signed-in admin before proxying anything.

  # One-shot: makes the dashboard password the two services share (see ops/omniroute/init.sh).
  # OmniRoute makes its own signing and encryption keys on first start and keeps them in its data volume.
  omniroute-init:
    image: caddy:2-alpine # already pulled for the gate; only busybox is used here
    entrypoint: ['sh', '/init.sh']
    environment:
      - ADMIN_PASSWORD=${OMNIROUTE_ADMIN_PASSWORD:-}
    volumes:
      - ./ops/omniroute/init.sh:/init.sh:ro
      - omniroute-secrets:/secrets
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 16m
    restart: 'no'

  omniroute:
    image: diegosouzapw/omniroute:${OMNIROUTE_VERSION:-3.8.52} # pinned; never latest
    # The image's own entrypoint (/app/check-permissions.sh) runs after the password is read from
    # the volume; a second line of `command` would be dropped when `entrypoint` is replaced.
    entrypoint:
      - /bin/sh
      - -c
      - |
        [ -s /run/omniroute/admin_password ] || { echo "omniroute: /run/omniroute/admin_password is missing (did omniroute-init run?)" >&2; exit 1; }
        INITIAL_PASSWORD=$$(cat /run/omniroute/admin_password)
        export INITIAL_PASSWORD
        exec /app/check-permissions.sh "$$@"
      - omniroute
    command: ['node', 'dev/run-standalone.mjs']
    depends_on:
      omniroute-init:
        condition: service_completed_successfully
    environment:
      - DATA_DIR=/app/data
      - DASHBOARD_PORT=20128
      - API_PORT=20129
      # Split-port mode: 20129 is an API-only bridge serving OpenAI-compatible routes. The image's
      # docs disagree on API_HOST's default (127.0.0.1 would be unreachable from the app
      # container), so set it explicitly; seen working in a running container.
      - API_HOST=0.0.0.0
      # Also the image's own default (#13679); kept explicit because the API
      # bridge binds a non-loopback host here.
      - REQUIRE_API_KEY=true
      # The app adds `Secure` to the cookie it hands the browser when the dashboard is on https
      # (lib/server/omniroute/gate.ts), so OmniRoute's own flag stays off and plain-http local use works.
      - AUTH_COOKIE_SECURE=${OMNIROUTE_COOKIE_SECURE:-false}
      - NEXT_PUBLIC_BASE_URL=${OMNIROUTE_PUBLIC_URL:-}
      - OMNIROUTE_PUBLIC_BASE_URL=${OMNIROUTE_PUBLIC_URL:-}
      - OMNIROUTE_ENABLE_LIVE_WS=false
    volumes:
      - omniroute-data:/app/data
      - omniroute-secrets:/run/omniroute:ro
    # No healthcheck of our own: the image ships one (HEALTHCHECK in its
    # Dockerfile runs `node healthcheck.mjs`, probing /healthz on the
    # dashboard port — verified for v3.8.52).
    mem_limit: ${OMNIROUTE_MEM_LIMIT:-1g}
    security_opt:
      - no-new-privileges:true
    networks:
      - omniroute
    restart: unless-stopped

  # The only port OmniRoute's stack publishes: a Caddy gate on the host loopback. cloudflared on
  # the host points here. Every path except the one-time /__enter ticket flow is checked by the app
  # first (Caddy forward_auth -> /api/admin/omniroute/check) and only proxied to OmniRoute's
  # dashboard when the app answers 2xx for a signed-in admin; the app's 401/403 answer is passed
  # back to the browser. See ops/omniroute/Caddyfile.
  omniroute-gate:
    image: caddy:2-alpine
    environment:
      # Where the gate asks "is this an admin?": the app container. ops/omniroute/host-dev.yml
      # points it at an app running on the host instead.
      - OMNIROUTE_APP_UPSTREAM=${OMNIROUTE_APP_UPSTREAM:-openmaic:3000}
    ports:
      # Loopback only — never widen to 0.0.0.0: this gate is all that stands
      # between the public hostname and the OmniRoute dashboard.
      - '127.0.0.1:${OMNIROUTE_GATE_PORT:-8081}:8081'
    volumes:
      - ./ops/omniroute/Caddyfile:/etc/caddy/Caddyfile:ro
    # A static gate needs little RAM.
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    # The caddy binary carries the file capability cap_net_bind_service, so with every capability
    # dropped the kernel refuses to start it ("exec /usr/bin/caddy: operation not permitted").
    # Keep that one; the gate listens on 8081 and never uses it.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - omniroute
    restart: unless-stopped

networks:
  default: {}
  # Isolated network for app <-> render-service traffic. `internal: true` means
  # no route to the host or internet. Both services share it so the app can
  # reach the render service; the render container additionally blocks its own
  # egress (iptables, see the service's entrypoint) so the untrusted Chromium
  # can't use this shared network to reach the app.
  render:
    internal: true
  # Shared network for openmaic <-> omniroute <-> omniroute-gate. NOT internal:
  # OmniRoute needs outbound internet to call the AI providers it routes to.
  # Postgres is not attached to it, so the third-party code cannot reach the
  # database.
  omniroute: {}

volumes:
  openmaic-data:
  openmaic-postgres:
  # OmniRoute's own data (SQLite: provider endpoints, keys, settings, and its own signing and
  # encryption keys). Not yet covered by ops/backup/backup.sh — see ops/omniroute/README.md ("Backup").
  omniroute-data:
  # The dashboard password OmniRoute and the app share. Written once by `omniroute-init`. Keep it
  # with `omniroute-data`: a password OmniRoute already saved is not replaced by a new file.
  omniroute-secrets:
