# Card 3D-02 [Unverified: never run on GitHub]. The author loop writes templates; a pull request is opened per template.
# The step that runs the model-written code has no write token; only the second job can push, and it only copies the
# accepted file. Auto-merge needs every gate true (scripts/manim-author-pr.mjs). Needs the secret MODEL_ROUTES_JSON and the
# Manim image/runner (card 3A-04); until then the job is dispatched by hand.
name: manim-author

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - eval/manim-author/briefs-3d.json
      - lib/subjects/math/clips/**

permissions:
  contents: read

jobs:
  author:
    name: Write and check templates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false   # no repository token is left on disk for the generated code
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Manim and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg texlive-latex-extra texlive-fonts-recommended dvipng libcairo2-dev libpango1.0-dev pkg-config
          python3 -m venv .venv && .venv/bin/pip install "manim==0.21.0" numpy pillow
      - name: Author loop
        env:
          MODEL_ROUTES: ${{ secrets.MODEL_ROUTES_JSON }}
          MANIM_PY: .venv/bin/python
        run: pnpm exec tsx eval/manim-author/runner.ts --out author-out
      - uses: actions/upload-artifact@v4
        with:
          name: author-out
          path: author-out

  open-prs:
    name: Open one pull request per template
    needs: author
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: author-out
          path: author-out
      - run: node scripts/manim-author-pr.mjs author-out
        env:
          GH_TOKEN: ${{ github.token }}
