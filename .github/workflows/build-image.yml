name: Build image

# Builds the app image on GitHub and publishes it to the GitHub Container Registry, so the
# server only has to pull it (ops/deploy/README.md). Nothing here touches the server.
#
#   push to it-math   ->  ghcr.io/nqthiep/openmaic:sha-<7 chars>  and  :it-math
#   push to ci/**     ->  ghcr.io/nqthiep/openmaic:sha-<7 chars>   (to try this workflow)
#   Run workflow      ->  the same, for the branch picked in the Actions tab
#
# The image holds no secret: secrets are read from the server's .env.local at run time.
# NEXT_PUBLIC_* values are compiled into the browser bundle, so they are fixed here, at build
# time. The defaults below are the empty values the server has always built with; change them
# in this file (not on the server) and the next build carries the change.

on:
  push:
    branches: [it-math, 'ci/**']
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  # A newer push replaces a build that is still running; it never replaces one that finished.
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/nqthiep/openmaic

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=it-math,enable=${{ github.ref == 'refs/heads/it-math' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          # The server is an x86-64 machine. deploy.sh refuses to run an image of another platform.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Dependency and build layers are reused between runs (a rebuild after a small change
          # takes a few minutes instead of the full build).
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: |
            NEXT_PUBLIC_MAIC_EDITOR_ENABLED=
            NEXT_PUBLIC_MAIC_EDITOR_RENDERER_ENABLED=
            NEXT_PUBLIC_MAIC_PLAYBACK_RENDERER_ENABLED=
            NEXT_PUBLIC_PI_CHAT_ENABLED=
            NEXT_PUBLIC_COURSEWARE_REFERENCE_ENABLED=
            NEXT_PUBLIC_SHOW_VOCATIONAL_TEST_UI=
            NEXT_PUBLIC_ENABLE_VIDEO_EXPORT=
            NEXT_PUBLIC_VIDEO_EXPORT_CTA_DESTINATION=
            NEXT_PUBLIC_ENABLE_PPTX_IMPORT=
            NEXT_PUBLIC_PRO_WORKBENCH_ENABLED=
            ALLOWED_FRAME_ANCESTORS=

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "Deploy on the server: \`~/OpenMAIC/ops/deploy/deploy.sh\` (after \`git pull\`)."
          } >> "$GITHUB_STEP_SUMMARY"
