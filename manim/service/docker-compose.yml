# The manim-service as deployed (cards 3C-03, 3C-04). The flags below are exactly the ones the red-team runs
# (manim/service/redteam/run.py): read-only root, no capabilities, no-new-privileges, memory, CPU and process limits, and an
# INTERNAL network: the service and its renderer have no route to the internet or to the host. The app joins the same network
# (add `networks: [manim]` to its service and set MANIM_SERVICE_URL=http://manim-service:8080); the token comes from the
# environment, never from this file.   docker compose -f manim/service/docker-compose.yml up --build
services:
  manim-service:
    build:
      context: ../..
      dockerfile: manim/Dockerfile
    image: manim-service:local
    environment:
      MANIM_SERVICE_TOKEN: ${MANIM_SERVICE_TOKEN:?set MANIM_SERVICE_TOKEN}
      MANIM_JOB_DEADLINE_MS: ${MANIM_JOB_DEADLINE_MS:-600000}
    networks: [manim]
    read_only: true
    tmpfs:
      - /work:size=2g,uid=1000
      - /tmp
      - /home/manimuser:uid=1000
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 2
    pids_limit: 256
    restart: unless-stopped

networks:
  manim:
    internal: true
